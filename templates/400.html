{% extends 'base.html' %}
{% load static %}

{% block title %}Bad Request - Ticketify{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[calc(100vh-20rem)] py-12">
    <div class="max-w-2xl w-full px-4 text-center">
        <div class="mb-8">
            <h1 class="font-display text-8xl md:text-9xl font-bold bg-gradient-to-r from-blue-600 to-cyan-600 bg-clip-text text-transparent mb-4">
                400
            </h1>
            <h2 class="text-3xl md:text-4xl font-bold text-gray-900 mb-4">
                Bad Request
            </h2>
            <p class="text-lg text-gray-600 mb-8">
                The request could not be understood by the server. Please check your input and try again.
            </p>
        </div>

        <div class="flex flex-col sm:flex-row gap-4 justify-center">
            <a href="/" class="inline-flex items-center justify-center bg-gradient-to-r from-indigo-600 to-purple-600 text-white px-8 py-4 rounded-full font-semibold hover:shadow-2xl hover:scale-105 transition-all text-base md:text-lg">
                <svg class="mr-2 w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                </svg>
                Go Home
            </a>
            <a href="javascript:history.back()" class="inline-flex items-center justify-center bg-white/10 backdrop-blur-sm text-gray-900 border-2 border-gray-300 px-8 py-4 rounded-full font-semibold hover:bg-gray-100 transition-all text-base md:text-lg">
                Go Back
            </a>
        </div>

        <div class="mt-12">
            <svg class="mx-auto h-64 w-64 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="0.5" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
        </div>
    </div>
</div>
{% endblock %}
