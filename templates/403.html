{% extends 'base.html' %}
{% load static %}

{% block title %}Access Denied - Ticketify{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[calc(100vh-20rem)] py-12">
    <div class="max-w-2xl w-full px-4 text-center">
        <div class="mb-8">
            <h1 class="font-display text-8xl md:text-9xl font-bold bg-gradient-to-r from-yellow-600 to-orange-600 bg-clip-text text-transparent mb-4">
                403
            </h1>
            <h2 class="text-3xl md:text-4xl font-bold text-gray-900 mb-4">
                Access Denied
            </h2>
            <p class="text-lg text-gray-600 mb-8">
                You don't have permission to access this page. If you believe this is an error, please contact support.
            </p>
        </div>

        <div class="flex flex-col sm:flex-row gap-4 justify-center">
            <a href="/" class="inline-flex items-center justify-center bg-gradient-to-r from-indigo-600 to-purple-600 text-white px-8 py-4 rounded-full font-semibold hover:shadow-2xl hover:scale-105 transition-all text-base md:text-lg">
                <svg class="mr-2 w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                </svg>
                Go Home
            </a>
            <a href="{% url 'accounts:login' %}" class="inline-flex items-center justify-center bg-white/10 backdrop-blur-sm text-gray-900 border-2 border-gray-300 px-8 py-4 rounded-full font-semibold hover:bg-gray-100 transition-all text-base md:text-lg">
                Sign In
            </a>
        </div>

        <div class="mt-12">
            <svg class="mx-auto h-64 w-64 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="0.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
            </svg>
        </div>
    </div>
</div>
{% endblock %}
