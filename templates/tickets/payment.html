{% extends 'base.html' %}

{% block title %}Payment - Ticketify{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <h1 class="text-4xl font-bold mb-8">Complete Payment</h1>

    <div class="bg-white rounded-lg shadow-md p-8">
        <div class="mb-6">
            <h2 class="text-2xl font-bold mb-4">Order #{{ order.order_number }}</h2>
            <p class="text-gray-600 mb-2">Total Amount: <span class="text-2xl font-bold text-indigo-600">£{{ order.order_total }}</span></p>
        </div>

        <form id="payment-form" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="md:col-span-2">
                    <label for="card-element" class="block text-sm font-medium text-gray-700 mb-2">
                        Card Details
                    </label>
                    <div id="card-element" class="p-4 border border-gray-300 rounded-lg"></div>
                    <div id="card-errors" class="text-red-600 text-sm mt-2"></div>
                </div>

                <div>
                    <label for="billing-country" class="block text-sm font-medium text-gray-700 mb-2">
                        Country *
                    </label>
                    <select
                        id="billing-country"
                        name="billing_country"
                        required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    >
                        <option value="GB" {% if order.country == 'United Kingdom' or order.country == 'GB' %}selected{% endif %}>United Kingdom</option>
                        <option value="IE" {% if order.country == 'Ireland' or order.country == 'IE' %}selected{% endif %}>Ireland</option>
                        <option value="US" {% if order.country == 'United States' or order.country == 'US' %}selected{% endif %}>United States</option>
                        <option value="CA" {% if order.country == 'Canada' or order.country == 'CA' %}selected{% endif %}>Canada</option>
                        <option value="AU" {% if order.country == 'Australia' or order.country == 'AU' %}selected{% endif %}>Australia</option>
                        <option value="FR" {% if order.country == 'France' or order.country == 'FR' %}selected{% endif %}>France</option>
                        <option value="DE" {% if order.country == 'Germany' or order.country == 'DE' %}selected{% endif %}>Germany</option>
                        <option value="ES" {% if order.country == 'Spain' or order.country == 'ES' %}selected{% endif %}>Spain</option>
                        <option value="IT" {% if order.country == 'Italy' or order.country == 'IT' %}selected{% endif %}>Italy</option>
                        <option value="NL" {% if order.country == 'Netherlands' or order.country == 'NL' %}selected{% endif %}>Netherlands</option>
                    </select>
                </div>

                <div>
                    <label for="billing-postcode" id="postcode-label" class="block text-sm font-medium text-gray-700 mb-2">
                        Post Code *
                    </label>
                    <input
                        type="text"
                        id="billing-postcode"
                        name="billing_postcode"
                        value="{{ order.post_code }}"
                        required
                        placeholder="Enter your post code"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    >
                </div>
            </div>

            <button
                id="submit-button"
                type="submit"
                class="w-full bg-indigo-600 text-white px-6 py-3 rounded-lg hover:bg-indigo-700 transition font-semibold disabled:opacity-50"
            >
                <span id="button-text">Pay £{{ order.order_total }}</span>
                <span id="spinner" class="hidden">Processing...</span>
            </button>
        </form>

        <div class="mt-6 text-center text-sm text-gray-600">
            <p>Your payment is secured by Stripe</p>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://js.stripe.com/v3/"></script>
<script>
    const stripe = Stripe('{{ stripe_public_key }}');
    const elements = stripe.elements();
    const cardElement = elements.create('card', {
        hidePostalCode: true,
        style: {
            base: {
                fontSize: '16px',
                color: '#32325d',
                fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
                '::placeholder': {
                    color: '#aab7c4'
                }
            },
            invalid: {
                color: '#fa755a',
                iconColor: '#fa755a'
            }
        }
    });

    cardElement.mount('#card-element');

    cardElement.on('change', function(event) {
        const displayError = document.getElementById('card-errors');
        if (event.error) {
            displayError.textContent = event.error.message;
        } else {
            displayError.textContent = '';
        }
    });

    const form = document.getElementById('payment-form');
    const submitButton = document.getElementById('submit-button');
    const buttonText = document.getElementById('button-text');
    const spinner = document.getElementById('spinner');

    // Update post code label based on country
    const countrySelect = document.getElementById('billing-country');
    const postcodeLabel = document.getElementById('postcode-label');
    const postcodeInput = document.getElementById('billing-postcode');

    function updatePostCodeLabel() {
        const country = countrySelect.value;

        if (country === 'US') {
            postcodeLabel.textContent = 'ZIP Code *';
            postcodeInput.placeholder = 'Enter your ZIP code';
        } else if (country === 'IE') {
            postcodeLabel.textContent = 'Eircode *';
            postcodeInput.placeholder = 'Enter your Eircode';
        } else if (country === 'CA') {
            postcodeLabel.textContent = 'Postal Code *';
            postcodeInput.placeholder = 'Enter your postal code';
        } else {
            postcodeLabel.textContent = 'Post Code *';
            postcodeInput.placeholder = 'Enter your post code';
        }
    }

    // Update label on page load
    updatePostCodeLabel();

    // Update label when country changes
    countrySelect.addEventListener('change', updatePostCodeLabel);

    form.addEventListener('submit', async function(event) {
        event.preventDefault();

        submitButton.disabled = true;
        buttonText.classList.add('hidden');
        spinner.classList.remove('hidden');

        // Get billing details
        const billingCountry = document.getElementById('billing-country').value;
        const billingPostcode = document.getElementById('billing-postcode').value;

        const {error, paymentIntent} = await stripe.confirmCardPayment(
            '{{ client_secret }}',
            {
                payment_method: {
                    card: cardElement,
                    billing_details: {
                        name: '{{ order.full_name }}',
                        email: '{{ order.email }}',
                        address: {
                            line1: '{{ order.address }}',
                            city: '{{ order.city }}',
                            postal_code: billingPostcode,
                            country: billingCountry
                        }
                    }
                }
            }
        );

        if (error) {
            const errorElement = document.getElementById('card-errors');
            errorElement.textContent = error.message;
            submitButton.disabled = false;
            buttonText.classList.remove('hidden');
            spinner.classList.add('hidden');
        } else {
            if (paymentIntent.status === 'succeeded') {
                window.location.href = '{% url "tickets:payment_success" order.order_number %}';
            }
        }
    });
</script>
{% endblock %}
